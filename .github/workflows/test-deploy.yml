name: Validate Astro

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check Astro types
        run: npm run check

      - name: Test
        run: npm test

      - name: Run prettier
        run: npm run format:check

      - name: Build Node site
        run: npm run build

      - name: Build and verify Pages site
        run: npm run build:pages && npm run verify:pages
